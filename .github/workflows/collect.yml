name: Collect market feeds

on:
  schedule:
    # Mondays. 13:00 UTC = 06:00 Pacific during PDT (summer).
    # For PST (winter) change to '0 14 * * 1'. GitHub cron is UTC and does not
    # observe daylight saving. Scheduled runs can fire 15-30 min late on the
    # free tier — harmless here.
    - cron: '0 13 * * 1'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser

      - name: Collect
        run: python scripts/collect.py --days 14

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Feed update ${{ github.run_number }}"
          branch: feed-update
          delete-branch: true
          title: "Feed update — review before merge"
          body: |
            Machine-collected. Rule-typed. **Not verified.**

            Before merging:
            - Skim `digest.md` for anything worth promoting into `data/market-data.js`
            - Check the source report at the top — a FAILED feed means a URL moved
            - Remember MW figures flagged `unstated` have not been confirmed as IT vs gross

            Merging publishes the headline feed to the live site. It does not
            change any curated figure.
          add-paths: |
            data/feed.js
            digest.md
